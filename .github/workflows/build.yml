# Build the extension against PostgreSQL 19.0 as packaged in the official
# Docker image, and run its test suites there.  The server headers and the
# test tools come from the PGDG repository the image is set up with, pinned
# to the image's own server version.  apt uses https, as in docker/Dockerfile:
# the image has no CA certificates, so ca-certificates alone is fetched
# without checking the mirror's certificate (apt still checks the signed
# InRelease files and the packages' hashes).  test/run.sh builds and tests
# as the postgres user, since initdb refuses to run as root; that user owns the
# directories the extension installs into.  The suites that need injection
# points skip themselves: the packaged server is built without them.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: postgres:19.0-trixie
      # dynamic shared memory for parallel workers, as scripts/docker.sh gives
      options: --shm-size=1g
    env:
      DEBIAN_FRONTEND: noninteractive
      IHEAP_IN_CONTAINER: 1
      BUILD: /tmp/build
      OUT: /tmp/out
    steps:
      - name: Install build and test dependencies
        run: |
          sed -i 's|^URIs: http://|URIs: https://|' /etc/apt/sources.list.d/debian.sources
          sed -i 's|http://apt\.postgresql\.org|https://apt.postgresql.org|' \
            /etc/apt/sources.list.d/pgdg.list
          grep -q 'https://apt\.postgresql\.org' /etc/apt/sources.list.d/pgdg.list
          grep -q '^URIs: https://' /etc/apt/sources.list.d/debian.sources
          apt-get -o Acquire::https::Verify-Peer=false update
          apt-get -o Acquire::https::Verify-Peer=false install -y --no-install-recommends \
            ca-certificates
          apt-get install -y --no-install-recommends \
            build-essential "postgresql-server-dev-$PG_MAJOR=$PG_VERSION" \
            libipc-run-perl python3
          chown postgres "$(pg_config --pkglibdir)" \
            "$(pg_config --pkglibdir)/bitcode" "$(pg_config --sharedir)/extension"

      - uses: actions/checkout@v7

      - name: Build
        run: runuser -u postgres -- env SRC="$GITHUB_WORKSPACE" bash test/run.sh build

      - name: Test
        run: |
          runuser -u postgres -- env SRC="$GITHUB_WORKSPACE" \
            bash test/run.sh test regress isolation tap model

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: /tmp/out
