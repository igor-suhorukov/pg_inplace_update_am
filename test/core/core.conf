# Appended to postgresql.conf of the core-suite instance (test/run.sh core),
# after test/iheap.conf.  Mirrors what pg_regress sets for its own temporary
# instances.
log_autovacuum_min_duration = 0
log_checkpoints = on
log_lock_waits = on
log_temp_files = 128kB

# The expected differences (expected_failures) are those of the table AM:
# indexes stay btree here.  The core-dm suite (core-dm.conf) runs the same
# tests with dmbtree indexes.
iheap.default_index_am = btree
iheap.unique_index_am = btree
